name: Build Windows .exe

# Builds the packaged StoryForge.exe on every push to master, on
# version tags (v*), and on demand via workflow_dispatch, in two variants:
#
#   cpu    -- llama-cpp-python from the author's prebuilt CPU wheel index
#   cuda13 -- llama-cpp-python from the prebuilt cu130 wheel index, plus the
#             pinned nvidia-cuda-runtime / nvidia-cublas DLL packages that
#             storyforge.spec bundles next to ggml-cuda.dll
#
# PyPI only publishes an sdist for llama-cpp-python, so installing it from
# PyPI would compile a CPU-only build from source. All versions are pinned
# (requirements-build.txt, requirements-cuda.txt, LLAMA_CPP_VERSION below) and
# --only-binary makes the job fail instead of silently compiling.
#
# Each build is zipped as StoryForge-<version>-<variant>.zip (version from
# app/__init__.py), with an empty models/ folder holding models/README.txt and
# the NLTK stopwords/wordnet data bundled. A pushed tag vX.Y.Z (which must
# match app/__init__.py) also builds each variant's per-user installer
# (installer/StoryForge.iss) and publishes the zips and installers as a GitHub Release.
#
# NOTE: this repo's default branch is `master`, not `main`.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  LLAMA_CPP_VERSION: "0.3.35"

jobs:
  build:
    runs-on: windows-latest
    # A hung GUI test used to sit until GitHub's 6-hour limit.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            wheel_index: https://abetlen.github.io/llama-cpp-python/whl/cpu
            extra_requirements: ""
          - variant: cuda13
            wheel_index: https://abetlen.github.io/llama-cpp-python/whl/cu130
            extra_requirements: requirements-cuda.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-build.txt
            requirements-cuda.txt

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install --only-binary=:all: --no-deps --index-url "${{ matrix.wheel_index }}" "llama-cpp-python==${{ env.LLAMA_CPP_VERSION }}"
          if ("${{ matrix.extra_requirements }}") { pip install -r "${{ matrix.extra_requirements }}" }
          pip freeze

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path app/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "Tag ${{ github.ref_name }} does not match app/__init__.py version $v"; exit 1
          }

      - name: Lint (ruff)
        run: ruff check app tests

      # The first Tk window on a fresh runner sometimes fails to read Tcl's own
      # init.tcl/tk.tcl (likely the virus scanner's first look at those files);
      # open a few windows up front so the tests start on warm files.
      - name: Warm up Tcl/Tk
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            python -c "import tkinter; root = tkinter.Tk(); root.update(); root.destroy(); print('Tk ok')"
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          exit 0

      - name: Run tests with coverage
        run: python -m pytest -q --timeout=300 --cov=app --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.variant }}
          path: coverage.xml
          retention-days: 7

      - name: Download NLTK data to bundle
        run: python -m nltk.downloader -d nltk_data stopwords wordnet

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean storyforge.spec

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $report = Join-Path $env:TEMP "StoryForge-selftest.txt"
          Remove-Item -LiteralPath $report -Force -ErrorAction SilentlyContinue
          $exe = Join-Path $PWD "dist\StoryForge\StoryForge.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            throw "Packaged self-test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $report)) {
            throw "Packaged self-test exited without writing its report."
          }
          if (-not (Select-String -Path $report -SimpleMatch "RESULT: PASS" -Quiet)) {
            Get-Content -LiteralPath $report
            throw "Packaged self-test did not report PASS."
          }

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/StoryForge/models | Out-Null
          Copy-Item models/README.txt dist/StoryForge/models/README.txt
          Compress-Archive -Path dist/StoryForge -DestinationPath "StoryForge-${{ steps.version.outputs.version }}-${{ matrix.variant }}.zip"

      # Releases also ship the per-user installer (installer/StoryForge.iss); only on tags, so
      # the per-push builds don't store another ~600 MB.
      - name: Make sure Inno Setup 6 is available
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build the installer
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DBuildVariant=${{ matrix.variant }}" installer\StoryForge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist\installer\StoryForge-${{ steps.version.outputs.version }}-${{ matrix.variant }}-setup.exe" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryForge-${{ steps.version.outputs.version }}-${{ matrix.variant }}
          path: |
            StoryForge-${{ steps.version.outputs.version }}-${{ matrix.variant }}.zip
            StoryForge-${{ steps.version.outputs.version }}-${{ matrix.variant }}-setup.exe
          if-no-files-found: error
          # Every push builds ~600 MB (cpu + cuda13); the default 90 days filled the account's
          # Actions storage quota. A tagged release keeps its zips as release assets anyway.
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/*.zip artifacts/*-setup.exe --repo "${{ github.repository }}" --title "StoryForge ${{ github.ref_name }}" --generate-notes

  audit:
    # Known vulnerabilities in the pinned/required Python packages (OSV / PyPI advisory data).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: pip-audit
        run: |
          # PYSEC-2026-2447 (diskcache, pickle in its cache files) has no fixed release; diskcache
          # only arrives through llama-cpp-python, and StoryForge never uses its disk cache.
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --progress-spinner off --ignore-vuln PYSEC-2026-2447
